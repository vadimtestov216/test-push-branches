name: Path beta

on:
  push:
    branches-ignore:
      - push-event-log
      - path-event-log-*
    paths:
      - beta/**

permissions:
  contents: write

concurrency:
  group: path-event-log-beta
  cancel-in-progress: false

jobs:
  record:
    name: Record beta path match
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Append path workflow record
        env:
          GH_TOKEN: ${{ github.token }}
          PATH_WORKFLOW_LABEL: beta
        run: .github/scripts/append-path-workflow-log.sh
